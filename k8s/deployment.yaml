apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api-deployment
spec:
  replicas: 1 # We start with 1, the HPA will scale it up
  selector:
    matchLabels:
      app: iris-api
  template:
    metadata:
      labels:
        app: iris-api
    spec:
      containers:
      - name: api-container
        # The image URI will be set by kubectl set image
        image: placeholder
        ports:
        - containerPort: 8080
        
        # --- THIS IS THE CRITICAL ADDITION ---
        # We must set resource requests for the HPA to work.
        # This requests 20% of a single vCPU.
        resources:
          requests:
            cpu: "200m" # "m" stands for milli-cores. 1000m = 1 vCPU.
        
        env:
        - name: MLFLOW_TRACKING_URI
          # This value will be replaced by sed
          value: "http://YOUR_MLFLOW_SERVER_IP:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: iris-api-service
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: iris-api