name: CD - Deploy and Stress Test Iris API

on:
  push:
    branches: [ week-7 ]

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REGION: asia-south1
  GKE_REGION: asia-south1
  
  GKE_CLUSTER_NAME: iris-cluster
  GAR_REPO_NAME: iris-api-repo
  DEPLOYMENT_NAME: iris-api-deployment
  IMAGE_NAME: iris-api

jobs:
  build-and-push-image:
    name: Build and Push to Artifact Registry
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    outputs:
      image_name: ${{ steps.build_and_push.outputs.image_name }}
      image_tag: ${{ steps.build_and_push.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Install gke-gcloud-auth-plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          sudo apt-get update
          sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GAR_REGION }}-docker.pkg.dev

      - name: Build Docker Image
        run: docker build -t $IMAGE_NAME -f Dockerfile .
          
      - name: Tag, Push, and Set Output
        id: build_and_push
        run: |
          export IMAGE_TAG=${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO_NAME }}/$IMAGE_NAME:${{ github.sha }}
          docker tag $IMAGE_NAME $IMAGE_TAG
          docker push $IMAGE_TAG
          echo "image_name=${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy-to-gke:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        id: auth
        uses: 'google-github-actions/auth@v1'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # Using full, working install step
      - name: Install gke-gcloud-auth-plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
          sudo apt-get update
          sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} --region ${{ env.GKE_REGION }}

      - name: Set production values in k8s manifest
        run: |
          sed -i 's|YOUR_MLFLOW_SERVER_IP|${{ secrets.MLFLOW_SERVER_IP }}|g' k8s/deployment.yaml
          sed -i 's|YOUR_PROJECT_ID|${{ env.GCP_PROJECT_ID }}|g' k8s/deployment.yaml

      - name: Deploy to GKE
        run: |
          export FULL_IMAGE_URI="${{ env.GAR_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO_NAME }}/${{ needs.build-and-push-image.outputs.image_name }}:${{ needs.build-and-push-image.outputs.image_tag }}"
          echo "Deploying with image: $FULL_IMAGE_URI"
          
          # Apply all configs in the k8s folder
          kubectl apply -f k8s/
          
          # Trigger the rolling update
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} api-container=$FULL_IMAGE_URI

  # --- NEW JOB FOR STRESS TESTING ---
  stress-test:
    name: Stress Test with wrk
    runs-on: ubuntu-latest
    needs: deploy-to-gke
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
      
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    steps:
    - name: Checkout
      uses: actions/checkout@v3 # Needed for the wrk script

    - name: Authenticate to GCP
      id: auth
      uses: 'google-github-actions/auth@v1'
      with:
        workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
          node-version: '24'
    
    - name: Install wrk and GKE plugin
      run: |
        sudo apt-get update
        sudo apt-get install -y wrk ca-certificates curl gnupg
        curl https://packages.cloud.google.com/apt/doc/apt-key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" | sudo tee -a /etc/apt/sources.list.d/google-cloud-sdk.list
        sudo apt-get update
        sudo apt-get install -y google-cloud-cli-gke-gcloud-auth-plugin
        npm i -g @dvcorg/cml
          npm install -g vega-cli vega-lite
          sudo apt-get update && sudo apt-get install -y \
            libcairo2-dev libfontconfig-dev libgif-dev \
            libjpeg-dev libpango1.0-dev librsvg2-dev

    - name: Get GKE credentials
      run: gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} --region ${{ env.GKE_REGION }}
        
    - name: Get External IP
      id: get_ip
      run: |
        echo "Waiting for external IP... (This can take 2-3 minutes)"
        while [ -z "$(kubectl get service iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')" ]; do
          sleep 10
          kubectl get service iris-api-service
        done
        IP=$(kubectl get service iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
        echo "SERVICE_IP=$IP" >> $GITHUB_ENV
        echo "External IP found: $IP"

    - name: Create Lua script for POST requests
      run: |
        cat <<EOF > wrk_post.lua
        wrk.method = "POST"
        wrk.body   = '{"sepal_length": 5.1, "sepal_width": 3.5, "petal_length": 1.4, "petal_width": 0.2}'
        wrk.headers["Content-Type"] = "application/json"
        EOF

    - name: Run wrk stress test (1000+ requests)
      run: |
        echo "Running stress test with 200 concurrent connections for 30s..."
        echo "## 📈 Stress Test Results" > report.md
        echo "\`\`\`" >> report.md
        # 200 connections for 30 seconds will generate thousands of requests
        wrk -t4 -c200 -d30s -s wrk_post.lua "http://${{ env.SERVICE_IP }}/predict"
        echo "\`\`\`" >> report.md
        
        # report.md file gets posted as a comment
        cml comment create report.md
